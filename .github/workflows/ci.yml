name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.28"

      - name: Install Python
        run: uv python install 3.12

      - name: Sync
        run: uv sync --frozen --all-groups

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Tests with coverage
        run: make coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
