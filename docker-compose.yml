name: ocpp-bench

services:
  csms:
    build: .
    image: ocpp-bench:local
    ports:
      - "9000:9000"
      - "9100:9100"
    environment:
      OCPP_BENCH_HOST: 0.0.0.0
      OCPP_BENCH_PORT: 9000
      OCPP_BENCH_ADMIN_PORT: 9100
      OCPP_BENCH_PROTOCOL: both
      OCPP_BENCH_LOG_JSON: "true"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - csms

  grafana:
    profiles: ["grafana"]
    image: grafana/grafana-oss:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
